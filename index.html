<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="A simple local expense tracker">
  <title>Expense Tracker</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="container py-4 py-md-5">
    <header class="mb-4">
      <h1 class="h2 mb-1">Expense Tracker</h1>
      <p class="text-secondary mb-0">Keep track of your spending.</p>
    </header>

    <section class="card mb-4" aria-label="Expense summary">
      <div class="row g-0">
        <div class="col-sm-6 p-3">
          <p class="summary-label mb-1">Total expenses</p>
          <p class="summary-value mb-0" id="total-expenses">₹0.00</p>
        </div>
        <div class="col-sm-6 p-3 border-top border-sm-start border-sm-top-0">
          <p class="summary-label mb-1">Total transactions</p>
          <p class="summary-value mb-0" id="total-transactions">0</p>
        </div>
      </div>
    </section>

    <section class="card mb-4" aria-labelledby="form-title">
      <div class="card-body p-4">
        <h2 class="h4 mb-4" id="form-title">Add expense</h2>

        <form id="expense-form" novalidate>
          <div class="row g-3">
            <div class="col-md-4">
              <label for="amount" class="form-label">Amount</label>
              <div class="input-group has-validation">
                <span class="input-group-text">₹</span>
                <input type="number" class="form-control" id="amount" min="0.01" step="0.01" placeholder="100" required>
                <div class="invalid-feedback">Enter an amount greater than 0.</div>
              </div>
            </div>
            <div class="col-md-4">
              <label for="description" class="form-label">Description</label>
              <input type="text" class="form-control" id="description" maxlength="100" placeholder="Movie" required>
              <div class="invalid-feedback">Enter a description.</div>
            </div>
            <div class="col-md-4">
              <label for="category" class="form-label">Category</label>
              <select class="form-select" id="category" required>
                <option value="" selected disabled>Choose a category</option>
                <option>Food</option>
                <option>Shopping</option>
                <option>Entertainment</option>
                <option>Travel</option>
                <option>Bills</option>
                <option>Health</option>
                <option>Education</option>
                <option>Other</option>
              </select>
              <div class="invalid-feedback">Choose a category.</div>
            </div>
          </div>
          <div class="d-flex flex-wrap gap-2 justify-content-end mt-4">
            <button type="button" class="btn btn-light d-none" id="cancel-edit">Cancel edit</button>
            <button type="submit" class="btn btn-primary px-4" id="submit-button">Add expense</button>
          </div>
        </form>
      </div>
    </section>

    <section aria-labelledby="expenses-title">
      <div class="d-flex align-items-center justify-content-between mb-3">
        <h2 class="h4 mb-0" id="expenses-title">Expenses</h2>
        <span class="text-secondary small" id="list-status" aria-live="polite"></span>
      </div>
      <div id="expense-list" class="card overflow-hidden"></div>
    </section>
  </main>
  <script src="js/app.js"></script>
</body>
</html>
