<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Node.js URL Routing</title>
</head>
<body>
    <h1>Node.js URL Routing</h1>

    <ul>
        <li><a href="http://localhost:3000/">Home (/)</a></li>
        <li><a href="http://localhost:3000/pizza">Pizza (/pizza)</a></li>
        <li><a href="http://localhost:3000/home">Home Page (/home)</a></li>
        <li><a href="http://localhost:3000/about">About (/about)</a></li>
        <li><a href="http://localhost:3000/node">Node (/node)</a></li>
        <li><a href="http://localhost:3000/contact">Contact (/contact)</a></li>
    </ul>
</body>
</html>
